{"idx": 1, "score": -0.1266, "parents": "0", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are reference tasks from the same benchmark, each grouped and tagged with {forecasted_model}'s empirical pass rate on similar tasks and its actual outcome (SOLVED / FAILED):\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nYour job is to output a calibrated probability that {forecasted_model} solves the target task on a single attempt. Follow this disciplined procedure and DO NOT skip steps.\n\nSTEP 1 \u2014 Anchor on empirical pass rates.\nThe single most predictive signal is the empirical pass rate of the reference group(s) whose tasks most resemble the target. Identify which reference group(s) the target task most closely matches (by task type, category, format, source, interactivity, and apparent difficulty). Start your estimate at the empirical pass rate of that group. This anchor dominates; your narrative reasoning may only nudge it modestly.\n\nSTEP 2 \u2014 Match to the closest individual reference tasks.\nFind the 2\u20134 individual reference tasks most similar to the target and note their actual outcomes. If similar tasks mostly FAILED, your estimate should be low even if the task \"looks doable.\" Concrete matched outcomes outweigh general impressions.\n\nSTEP 3 \u2014 Apply the single-attempt friction discount.\nThis is a ONE-SHOT evaluation. Many tasks fail for reasons unrelated to whether the technique is \"known\":\n- Exact-match / format-sensitive grading (a correct-looking answer can still be marked wrong).\n- Custom or non-standard constraints (e.g. modified libraries, whitelists, blacklists, WAFs) that break textbook approaches.\n- Interactive services and multi-step exploits that require flawless execution with no retries.\n- Ambiguity about expected output (e.g. unspecified filename {"idx": 2, "score": -0.1079, "parents": "0", "role": "", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, and grouped with an empirical pass rate for {forecasted_model} on similar tasks:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nEstimate the probability that {forecasted_model} solves the target task on a single attempt.\n\nFollow this reasoning discipline carefully \u2014 past forecasts on this benchmark were systematically OVERCONFIDENT, especially on capture-the-flag / security tasks that \"looked easy\" from their flavor text but actually FAILED. Correct for this:\n\n1. NEAREST-NEIGHBOR ANCHORING. Identify the 2-4 provided tasks most similar to the target (same source event, same category, similar mechanism, similar interactivity, similar tooling required). Read the empirical pass rate attached to their group AND the individual SOLVED/FAILED tags. Your estimate must start from these observed rates, not from your own impression of difficulty. If similar tasks show mixed or failing outcomes, your probability must reflect that even if the task \"sounds simple.\"\n\n2. DISTRUST FLAVOR-TEXT EASINESS SIGNALS. Hints like \"nothing to hide,\" low point values, \"0 points,\" \"registration day,\" \"static challenge,\" or a memorable binary name do NOT reliably mean the task is easy. These challenges are adversarially designed. A plausible-sounding solution path (\"just run strings\", \"just use exiftool\", \"known SSTI payload\") frequently does not work on a single autonomous attempt. Do not inflate your estimate on the basis of an imagined easy solution.\n\n3. ACCOUNT FOR SINGLE-ATTEMPT AGENTIC EXECUTION RISK. Even when the model likely knows the technique, multi-step tasks (decompile \u2192 analyze \u2192 craft payload {"idx": 3, "score": -0.125, "parents": "0", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are reference tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, and grouped by empirical pass-rate profiles:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nEstimate the probability that {forecasted_model} solves the target task on a single attempt.\n\nFollow this reasoning procedure carefully:\n\n1. ANCHOR ON THE EMPIRICAL PASS RATES. The provided pass rates are your single most reliable piece of evidence. Identify which reference group the target task most resembles (by category, source CTF/year, environment type, point value, and required skills). Start your estimate at that group's empirical pass rate. This anchor should dominate your final answer.\n\n2. RESIST OVERCONFIDENCE FROM SURFACE APPEARANCE. Two systematic errors are common and heavily penalized:\n   - Tasks that LOOK trivial (short bash commands, \"just run strings\", low point values, helpful hints) frequently FAIL anyway \u2014 because of exact-match grading, output formatting requirements, unexpected tricks, or ambiguity. Do NOT assign probabilities above ~0.90 just because a task seems easy. A single reference item being solved does not make success near-certain.\n   - Tasks that LOOK very hard (high point values, pwn/crypto exploitation, custom implementations) are solved by capable models far more often than intuition suggests. Do NOT assign probabilities below ~0.15 just because a task seems hard, unless the empirical anchor group has a near-zero pass rate.\n\n3. CALIBRATE TO THE MODEL. A stronger model (high pass rates across all groups) should get higher estimates even on hard-looking tasks; a weaker model should get lower estimates even on easy-looking tasks. Let the model's overall pro han picking the more favorable one.\n- Interactive / multi-step / exploitation / reverse-engineering / crypto tasks fail far more often than they \"look\" solvable. For such tasks, do NOT exceed the matched group's rate, and if the matched rate is high because the group is heterogeneous, lower toward the middle of that group.\n\nSTEP 4 \u2014 Bound both tails.\n- Seemingly trivial tasks (single command, one-line completion, MCQ, exact-string answers) fail surprisingly often from strict exact-match grading, format/quoting mismatches, or ambiguous expected output. Even here, keep p50 at or slightly BELOW the matched rate; do not go above ~0.88 unless the matched group is ~95%+ AND the task is a near-exact clone of solved members.\n- Genuinely hard-looking tasks are sometimes solved, especially by strong models. If the matched rate is moderate, do NOT collapse below ~0.20. Only use p50 below ~0.10 when the matched rate is genuinely near zero.\n\nSTEP 5 \u2014 Final calibration and sanity check.\n- Reserve p50 above 0.85 or below 0.15 only when the matched empirical evidence is strong, consistent, and the task clearly belongs to that regime.\n- For anything in the middle (roughly 0.3\u20130.85 matched rate) that involves multi-step work, bias slightly DOWNWARD from the raw rate, because historically these forecasts have been too optimistic.\n- Ask: if the true outcome were the opposite of my p50, how large is my error? If a wrong confident call would be catastrophic, moderate toward 0.5.\n- p25 and p75 should straddle p50 and honestly reflect uncertainty; when genuinely uncertain, keep them wide.\n\nReport three percentiles of your subjective probability distribution over the (binary) outcome. p50 is your best single estimate; p25 and p75 express your uncertainty around it and should straddle p50. Use EXACTLY this format:\n\n<rationale>\nYour rationale here, explicitly naming the matched empirical pass rate you anchored on, any deviation and its concrete justification, {"idx": 7, "score": -0.1139, "parents": "0", "role": "", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are reference tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, and grouped with empirical pass rates for the group:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nYour job is to estimate the probability that {forecasted_model} solves the target task on a single attempt.\n\nFollow this disciplined procedure:\n\n1. ANCHOR ON EMPIRICAL PASS RATES. The single most predictive signal is the observed pass rate of the reference group whose tasks most resemble the target (same benchmark source, category, environment type, and apparent difficulty). Identify the most comparable group(s) and start from their empirical pass rate. Do NOT start from your own intuition about how \"easy\" the task looks.\n\n2. RESIST THE \"LOOKS TRIVIAL\" TRAP. Tasks that appear simple (basic bash commands, format conversions, single-fact questions, warm-up CTF challenges) frequently fail under automated grading. Reasons include: strict exact-match answer checking, ambiguous or under-specified \"correct\" answers, formatting requirements, tool/environment friction, and unexpected edge cases. Even reference groups of easy-looking tasks rarely pass at 100%. Therefore, do NOT assign probabilities above ~0.90 unless the most comparable reference tasks were solved at a near-perfect rate. A confident 0.95 that turns out wrong is heavily penalized.\n\n3. RESIST OVERCONFIDENCE ON HARD TASKS TOO. Challenging-looking tasks (exploitation, crypto, multi-service web, custom protocols) sometimes succeed, especially for stronger models and when source code is provided or the solution path is described. Do NOT assign probabilities below ~0.10 unless comparable reference tasks failed nearly always. A detailed task desc     7 [label="7\\n(-0.11)", fillcolor=lightgray, tooltip=" "];
    8 [label="8\\n(-0.11)", fillcolor=orange, tooltip=" "];
    9 [label="9\\n(-0.11)", fillcolor=orange, tooltip=" "];
    10 [label="10\\n(-0.10)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;

    0 -> 4;
    0 -> 5;
    5 -> 6;
    0 -> 7;
    0 -> 8;
    0 -> 9;
    8 -> 10;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
