<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEPA Candidate Tree</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #dee2e6; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  #header h1 { font-size: 18px; font-weight: 600; color: #212529; }
  .legend { display: flex; gap: 14px; font-size: 13px; color: #495057; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid #adb5bd; }
  #graph-container { flex: 1 1 auto; width: 100%; overflow: auto; padding: 20px; text-align: center; }
  #graph-container svg { width: 100%; height: 100%; }
  #tooltip {
    display: none; position: fixed; background: #fff; border: 1px solid #dee2e6;
    border-radius: 8px; padding: 14px 16px; max-width: 560px; max-height: 70vh; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 1000; font-size: 13px; line-height: 1.5;
  }
  #tooltip .tt-header { font-weight: 700; font-size: 15px; margin-bottom: 6px; color: #212529; }
  #tooltip .tt-meta { color: #6c757d; margin-bottom: 4px; }
  #tooltip .tt-hint { color: #adb5bd; font-size: 11px; font-style: italic; margin-bottom: 10px; }
  #tooltip .tt-comp-name { font-weight: 600; color: #495057; margin-top: 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 2px; }
  #tooltip .tt-comp-text {
    white-space: pre-wrap; word-break: break-word; background: #f8f9fa;
    border: 1px solid #e9ecef; border-radius: 4px; padding: 8px 10px; margin-top: 4px;
    font-family: "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px;
    max-height: 200px; overflow-y: auto;
  }
  .role-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; margin-left: 6px; }
  .role-best { background: #00e5ff33; color: #006064; }
  .role-pareto { background: #ff980033; color: #e65100; }
  .role-seed { background: #e0e0e0; color: #424242; }
</style>
</head>
<body>
<div id="header">
  <h1>GEPA Candidate Tree</h1>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:cyan"></div> Best</div>
    <div class="legend-item"><div class="legend-dot" style="background:orange"></div> Pareto Front</div>
    <div class="legend-item"><div class="legend-dot" style="background:lightgray"></div> Other</div>
  </div>
</div>
<div id="graph-container"><p>Loading graph&hellip;</p></div>
<div id="tooltip"></div>

<script type="module">
const NODES = [{"idx": 0, "score": -0.0995, "parents": "seed", "role": "Best", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nEstimate the probability that {forecasted_model} solves the target task on a single attempt. Report three percentiles of your subjective probability distribution using EXACTLY this format:\n\n<rationale>\nYour rationale here.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>\n"}},
{"idx": 1, "score": -0.1266, "parents": "0", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are reference tasks from the same benchmark, each grouped and tagged with {forecasted_model}'s empirical pass rate on similar tasks and its actual outcome (SOLVED / FAILED):\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nYour job is to output a calibrated probability that {forecasted_model} solves the target task on a single attempt. Follow this disciplined procedure and DO NOT skip steps.\n\nSTEP 1 \u2014 Anchor on empirical pass rates.\nThe single most predictive signal is the empirical pass rate of the reference group(s) whose tasks most resemble the target. Identify which reference group(s) the target task most closely matches (by task type, category, format, source, interactivity, and apparent difficulty). Start your estimate at the empirical pass rate of that group. This anchor dominates; your narrative reasoning may only nudge it modestly.\n\nSTEP 2 \u2014 Match to the closest individual reference tasks.\nFind the 2\u20134 individual reference tasks most similar to the target and note their actual outcomes. If similar tasks mostly FAILED, your estimate should be low even if the task \"looks doable.\" Concrete matched outcomes outweigh general impressions.\n\nSTEP 3 \u2014 Apply the single-attempt friction discount.\nThis is a ONE-SHOT evaluation. Many tasks fail for reasons unrelated to whether the technique is \"known\":\n- Exact-match / format-sensitive grading (a correct-looking answer can still be marked wrong).\n- Custom or non-standard constraints (e.g. modified libraries, whitelists, blacklists, WAFs) that break textbook approaches.\n- Interactive services and multi-step exploits that require flawless execution with no retries.\n- Ambiguity about expected output (e.g. unspecified filenames, expected format).\nKnowing HOW to solve a task is NOT strong evidence that it will be solved on the first attempt. If you catch yourself reasoning \"the model surely knows this technique\" or \"the description explains the approach,\" treat that as a reason for caution, not confidence, and adjust DOWNWARD.\n\nSTEP 4 \u2014 Guard against overconfidence and optimism bias.\n- Do NOT default to values near 0.9 unless the target closely matches a reference group with a very high (>90%) empirical pass rate AND is a simple, low-friction task (e.g. a factual MCQ or a single well-specified command).\n- For CTF-style challenges (crypto, rev, pwn, web, misc) with custom code, interactive services, or cryptic hints, calibrated estimates are usually well below 0.6, and often below 0.4, even for strong models.\n- Do NOT inflate estimates because a category \"should\" be a model strength. Rely on the empirical pass rate of similar tasks instead.\n- Only report high confidence when the matched evidence genuinely supports it.\n\nSTEP 5 \u2014 Set your distribution.\nReport your median (p50) as your best single-attempt probability after the above adjustments. Set p25 and p75 to reflect genuine uncertainty (a spread of roughly 0.12\u20130.25 between them is typical; wider when reference evidence is sparse or mixed). Make sure p25 < p50 < p75.\n\nSanity check before answering: Is my p50 anchored on the empirical pass rate of the most similar tasks, or have I drifted upward on the basis of narrative reasoning about the model's skills? If the latter, pull it back toward the empirical anchor.\n\nReport three percentiles of your subjective probability distribution using EXACTLY this format:\n\n<rationale>\nYour rationale here.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},
{"idx": 2, "score": -0.1079, "parents": "0", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, and grouped with an empirical pass rate for {forecasted_model} on similar tasks:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nEstimate the probability that {forecasted_model} solves the target task on a single attempt.\n\nFollow this reasoning discipline carefully \u2014 past forecasts on this benchmark were systematically OVERCONFIDENT, especially on capture-the-flag / security tasks that \"looked easy\" from their flavor text but actually FAILED. Correct for this:\n\n1. NEAREST-NEIGHBOR ANCHORING. Identify the 2-4 provided tasks most similar to the target (same source event, same category, similar mechanism, similar interactivity, similar tooling required). Read the empirical pass rate attached to their group AND the individual SOLVED/FAILED tags. Your estimate must start from these observed rates, not from your own impression of difficulty. If similar tasks show mixed or failing outcomes, your probability must reflect that even if the task \"sounds simple.\"\n\n2. DISTRUST FLAVOR-TEXT EASINESS SIGNALS. Hints like \"nothing to hide,\" low point values, \"0 points,\" \"registration day,\" \"static challenge,\" or a memorable binary name do NOT reliably mean the task is easy. These challenges are adversarially designed. A plausible-sounding solution path (\"just run strings\", \"just use exiftool\", \"known SSTI payload\") frequently does not work on a single autonomous attempt. Do not inflate your estimate on the basis of an imagined easy solution.\n\n3. ACCOUNT FOR SINGLE-ATTEMPT AGENTIC EXECUTION RISK. Even when the model likely knows the technique, multi-step tasks (decompile \u2192 analyze \u2192 craft payload \u2192 interact with a live service) have compounding failure points. Discount accordingly. Interactive/exploitation tasks are harder than they read.\n\n4. CALIBRATE, DON'T GUESS CONFIDENTLY. Reserve p50 above ~0.90 only for tasks essentially identical to consistently-SOLVED simple tasks (basic bash/MCQ/trivial file tasks with very high observed pass rates). Reserve p50 below ~0.15 only for tasks resembling consistently-FAILED hard tasks. For genuinely ambiguous CTF-style tasks where similar examples are mixed, keep p50 in a moderate range (roughly 0.30-0.60) rather than committing hard in either direction \u2014 a wrong confident call is heavily penalized, while a hedged call near the true base rate is safe.\n\n5. WEIGHT THE MODEL. Stronger models solve more of the harder tasks; weaker models fail more even on moderate tasks. Read the overall pattern of pass rates for {forecasted_model} across the profile and shift your estimate to match that model's demonstrated ceiling.\n\nThen report three percentiles of your subjective probability distribution over the (0/1) outcome. p50 is your central estimate; p25 and p75 express your uncertainty. Ensure p25 <= p50 <= p75.\n\nEnd your response with EXACTLY this structure (percentiles as probabilities in [0, 1]):\n\n<rationale>\nYour rationale here.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},
{"idx": 3, "score": -0.125, "parents": "0", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are reference tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, and grouped by empirical pass-rate profiles:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nEstimate the probability that {forecasted_model} solves the target task on a single attempt.\n\nFollow this reasoning procedure carefully:\n\n1. ANCHOR ON THE EMPIRICAL PASS RATES. The provided pass rates are your single most reliable piece of evidence. Identify which reference group the target task most resembles (by category, source CTF/year, environment type, point value, and required skills). Start your estimate at that group's empirical pass rate. This anchor should dominate your final answer.\n\n2. RESIST OVERCONFIDENCE FROM SURFACE APPEARANCE. Two systematic errors are common and heavily penalized:\n   - Tasks that LOOK trivial (short bash commands, \"just run strings\", low point values, helpful hints) frequently FAIL anyway \u2014 because of exact-match grading, output formatting requirements, unexpected tricks, or ambiguity. Do NOT assign probabilities above ~0.90 just because a task seems easy. A single reference item being solved does not make success near-certain.\n   - Tasks that LOOK very hard (high point values, pwn/crypto exploitation, custom implementations) are solved by capable models far more often than intuition suggests. Do NOT assign probabilities below ~0.15 just because a task seems hard, unless the empirical anchor group has a near-zero pass rate.\n\n3. CALIBRATE TO THE MODEL. A stronger model (high pass rates across all groups) should get higher estimates even on hard-looking tasks; a weaker model should get lower estimates even on easy-looking tasks. Let the model's overall profile shift your anchor.\n\n4. STAY IN THE MIDDLE WHEN UNCERTAIN. If the target task's difficulty is genuinely ambiguous or you cannot confidently match it to a group, keep your p50 near the middle of the plausible range (roughly 0.35\u20130.65) rather than committing to a confident extreme. Reserve p50 values above 0.90 or below 0.10 only for cases where the empirical anchor is itself that extreme AND the task clearly matches that group.\n\n5. SET PERCENTILES to reflect genuine uncertainty. Make p25 and p75 reasonably wide around p50 (typically a spread of at least 0.15\u20130.25 total) to express that you are forecasting a single binary outcome with limited information.\n\nReport three percentiles of your subjective probability distribution using EXACTLY this format:\n\n<rationale>\nYour rationale here. State the empirical anchor you chose, any adjustment for the model's strength, and why you did or did not move far from the anchor.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},
{"idx": 4, "score": -0.1173, "parents": "0", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, grouped by empirical pass-rate groups:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nEstimate the probability that {forecasted_model} solves the target task on a single attempt.\n\nCALIBRATION GUIDANCE \u2014 read carefully, these correct common forecasting errors:\n\n1. ANCHOR ON EMPIRICAL PASS RATES, NOT ON HOW HARD THE TASK \"LOOKS\". Your first step is to identify which group(s) of shown examples most resemble the target task, and read off their empirical pass rate. That pass rate is your starting point. Your reasoning about task content should only nudge this anchor, rarely by more than ~0.15.\n\n2. BEWARE \"TRIVIAL-LOOKING\" TASKS. Short tasks \u2014 multiple-choice questions, \"convert this to a bash command\", one-line utility commands \u2014 frequently FAIL in practice even for strong models. Reasons: strict exact-match grading, multiple valid answers where only one is accepted, ambiguous phrasing, unusual quoting/escaping, or the \"obvious\" answer being wrong. A task looking easy to a human is weak evidence. NEVER assign a task above 0.90 just because it seems trivial. If the relevant group's empirical pass rate is (say) 85\u201395%, use roughly that number \u2014 do not inflate to 0.97+.\n\n3. AVOID EXTREME PROBABILITIES. Reserve p50 above 0.92 only when the relevant empirical pass rate is essentially 100% AND the task is clearly routine. Reserve p50 below 0.10 only when the relevant pass rate is essentially 0%. Because ground truth is binary and your judgment is imperfect, extreme confidence is heavily penalized when wrong. When genuinely uncertain, pull toward 0.5.\n\n4. HARD TASKS ARE NOT HOPELESS. Even challenging exploitation/pwn/crypto/rev tasks are sometimes solved by capable models. If the relevant group's pass rate is ~30\u201340%, do not collapse to single digits just because the task description looks intimidating \u2014 stay near the empirical rate.\n\n5. COMBINE EVIDENCE. If the target resembles examples from more than one pass-rate group, interpolate between their rates. Weight the groups whose example tasks are most structurally and topically similar (same CTF source, same category, same format, similar provided files, static vs. interactive).\n\n6. Set p25 and p75 to reflect genuine uncertainty around your p50, but remember the outcome is binary \u2014 your p50 is the number that will be scored, so make it your honest best estimate of the probability of success, well-calibrated rather than confident.\n\nReport three percentiles of your subjective probability distribution using EXACTLY this format:\n\n<rationale>\nYour rationale here. State (a) which example group(s) are most similar and their empirical pass rate(s), (b) how you interpolate/adjust, (c) your final calibrated p50.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}}];
const DOT = `digraph G {
    rankdir=TB;
    node [style=filled, shape=circle, fontsize=14, width=0.6, height=0.6];
    0 [label="0\\n(-0.10)", fillcolor=cyan, tooltip=" "];
    1 [label="1\\n(-0.13)", fillcolor=orange, tooltip=" "];
    2 [label="2\\n(-0.11)", fillcolor=orange, tooltip=" "];
    3 [label="3\\n(-0.12)", fillcolor=orange, tooltip=" "];
    4 [label="4\\n(-0.12)", fillcolor=orange, tooltip=" "];
    0 -> 1;
    0 -> 2;
    0 -> 3;
    0 -> 4;
}`;

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
