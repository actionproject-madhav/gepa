{"idx": 2, "score": -0.1171, "parents": "0", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, grouped by empirical pass rate:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nYour job is to estimate the probability that {forecasted_model} solves the target task on a single attempt. Follow this disciplined procedure:\n\nSTEP 1 \u2014 Anchor on empirical evidence.\nIdentify which group(s) of example tasks most resemble the target in category, format, required skill, and grading style. Read off the empirical pass rate(s) for those group(s). This pass rate is your PRIMARY anchor. Start your estimate there, not from your own intuition about how \"easy\" the task looks.\n\nSTEP 2 \u2014 Resist the \"looks trivial\" trap.\nA task that seems trivial to a knowledgeable human is NOT automatically a near-certain solve. Common reasons capable models fail seemingly-easy tasks:\n- Strict/exact-match grading: short answers, command completions, or fill-in-the-blank tasks where an under-specified target (e.g. an unknown binary name, a missing flag, a formatting nuance) causes the graded answer to mismatch even when the model \"knows\" the concept.\n- Ambiguity in what output format is accepted.\n- Multi-step or interactive tasks where any single misstep fails the whole task.\nDo NOT assign >0.90 to a short knowledge/completion task unless the closest analogues were near-uniformly solved AND grading is clearly forgiving. When grading looks strict or the target is under-specified, pull your estimate down substantially (e.g. into the 0.4\u20130.7 range) even if the concept is basic.\n\nSTEP 3 \u2014 Calibrate against extremes.\n- Reserve p50 above 0.90 only when nearly all closely-matching examples were solved and the {"idx": 3, "score": -0.0972, "parents": "0", "role": "Best", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, along with the empirical pass rate of the group each is drawn from:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nYour job is to estimate the probability that {forecasted_model} solves the target task on a single attempt. Follow this disciplined procedure:\n\nSTEP 1 \u2014 Find the closest analogs. Identify which of the grouped examples the target task most resembles, based on: task family/source (e.g. same CTF, same tool), category (rev/pwn/crypto/web/forensics/bash-knowledge), whether it is a static vs. interactive challenge, the number of steps required, and how self-contained it is. Note the empirical pass rate(s) reported for those closest analogs.\n\nSTEP 2 \u2014 Anchor to the empirical pass rate. The single most predictive signal is the observed pass rate of the group(s) the target most closely matches. Start your p50 at that anchor. Do NOT default to 0.5 when uncertain \u2014 uncertainty about your reasoning is not the same as a 50% event. If the closest analogs solved at ~85%, your p50 should be near 0.85, not pulled toward the middle.\n\nSTEP 3 \u2014 Adjust modestly for task-specific signals, in either direction:\n  - Trivial knowledge/command-completion tasks (single well-known command, MCQ, syntax fill-in) are near-certain for capable models: use 0.92\u20130.99.\n  - Tasks matching a high-pass-rate group with no unusual complexity: stay high (0.75\u20130.95).\n  - Tasks matching a low-pass-rate group (complex multi-step exploitation, custom crypto, interactive pwn) should stay low (0.05\u20130.30) even if the objective sounds \"clear\" or the point value is low \u2014 clear objectives do not make exploitation reliable.\n  - Only place p50 near 0.40\u20130.60 when the analogs genuinely straddle that range AND the task-specific signals are truly mixed. This should be relatively rare.\n\nSTEP 4 \u2014 Account for the specific model. Stronger models (e.g. later GPT/Codex/Opus generations) have higher pass rates across every group; weaker/older models drop off sharply on harder tasks. Use the model's own demonstrated pass rates in the profile, not a generic estimate.\n\nSTEP 5 \u2014 Calibrate confidence. Prefer decisive probabilities when the evidence is decisive. Well-separated forecasts (high for easy, low for hard) score far better on average than clustered mid-range hedges. Reserve wide/central distributions only for genuinely ambiguous cases.\n\nSet p25 and p75 to express your residual uncertainty around p50, keeping them consistent with your anchor (narrow bands for clear-cut easy/hard tasks, wider bands for ambiguous ones).\n\nEnd your response with EXACTLY this XML structure (percentiles as probabilities in [0, 1]):\n\n<rationale>\nYour rationale here, explicitly naming the closest analog task(s), their pass rate, your anchor, and your adjustments.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},
{"idx": 4, "score": -0.1077, "parents": "1", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are reference tasks from the same benchmark, grouped and each tagged with whether {forecasted_model} actually solved it. Each group reports an EMPIRICAL PASS RATE for {forecasted_model} on similar tasks \u2014 this is your single most important source of evidence.\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nEstimate the probability that {forecasted_model} solves the target task on a single attempt.\n\nFollow this disciplined procedure:\n\n1. FIND THE GROUP-LEVEL BASE RATE. Identify which reference group most closely resembles the target task (by source/competition, category, environment type \u2014 static file vs. interactive/exploitation \u2014 and overall style). Take that group's reported empirical pass rate as your starting BASE RATE. If the target sits between two groups, interpolate.\n\n2. CHECK THE NEAREST INDIVIDUAL EXAMPLES \u2014 THIS OVERRIDES THE AGGREGATE WHEN THEY CONFLICT. Look at the specific tagged reference tasks (anchors and easier examples), and find the one or two whose FORMAT and PHRASING most closely match the target (e.g. a \"convert this to a bash command\" task matches other bash-command tasks; a \"decompile and exploit a binary\" task matches other RE-binary tasks). The actual SOLVED/FAILED outcome on the nearest-format example is strong evidence and frequently disagrees with the group average.\n   - If the nearest same-format example FAILED, do NOT forecast high just because the task \"looks simple\" or the group average is high. Pull your estimate substantially toward failure (often into the 0.30\u20130.55 range even when the group average is ~0.85+).\n   - If the nearest same-format example SOLVED, you may keep or raise your estimate toward that outcome.\n   - When several same-format examples exist with mixed outcomes, use their local hit rate rather than the whole group.\n\n3. RESIST \"IT LOOKS EASY / I RECOGNIZE THIS\" REASONING. Tasks that appear trivial (a one-line command, a well-known attack class like RSA weaknesses, pickle RCE, ROP) still fail surprisingly often due to escaping/quoting subtleties, environment interaction, custom restrictions, and one-shot execution. Recognizing the technique does NOT justify raising your estimate. Extra provided files or unusual constraints (specific OS, \"malware\", custom modules) signal added difficulty and should pull DOWN.\n\n4. AVOID OVERCONFIDENCE AT THE HIGH END. A forecast above ~0.85 requires that BOTH the group average is very high AND the nearest same-format example(s) actually succeeded. If a nominally-easy task's closest matching example failed, cap your p50 well below 0.85. Reserve very low forecasts (below ~0.10) for interactive/exploitation tasks whose matched group and examples are near-uniformly failures.\n\n5. CALIBRATE p50 AND SPREAD.\n   - Set p50 to your best point estimate after applying steps 1\u20134.\n   - If the matched evidence is extreme and consistent (group rate near 0.9+ or near 0.1- AND the nearest example agrees), keep p50 close to that rate with a moderate spread.\n   - If the group rate is high but the nearest same-format example failed (or vice versa), treat the outcome as genuinely uncertain: set p50 nearer 0.4\u20130.6 with a wide spread. Do not pretend you can resolve a coin-flip.\n   - Never report a p50 that contradicts clearly-consistent empirical evidence.\n\nReport three percentiles of your subjective probability distribution using EXACTLY this format:\n\n<rationale>\nYour rationale here. State (a) the matched group and its empirical rate, (b) the nearest same-format individual example(s) and their actual SOLVED/FAILED outcome, and (c) how you reconciled them into your final p50.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},
{"idx": 5, "score": -0.1202, "parents": "2", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, grouped by empirical pass rate among similar tasks:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nYour goal is a well-calibrated probability that {forecasted_model} solves the target task on a single attempt. The number that will be scored is your p50 against a binary outcome, so calibration matters far more than confidence. Follow this procedure:\n\nSTEP 1 \u2014 Find the closest analogues and read their OUTCOMES, not just group averages.\n- Identify the example tasks that most resemble the target in SOURCE (same CTF/benchmark family), CATEGORY (rev, crypto, web, pwn, forensics, bash-command, MCQ, etc.), FORMAT, and required skill.\n- Look at the actual SOLVED/FAILED labels on those specific closest analogues, AND the empirical pass rate of the group they sit in. Both are evidence.\n- If several close analogues were solved, that is strong evidence the model handles this type \u2014 even if the task looks specialized. If several were failed, that is strong evidence against.\n- Your starting anchor is the empirical pass rate of the group whose members most resemble the target. Write it down explicitly.\n\nSTEP 2 \u2014 Account for who this model is.\n- The pass rates already reflect THIS model's capability. A model with high pass rates across most groups will likely solve the target unless it clearly matches the model's weakest group.\n- Do NOT apply a generic \"this task is specialized/multi-step, so it must be hard\" discount on top of the empirical rate. The empirical rate for similar tasks already captures difficulty. A narrative about JWT chains, Verilog reverse engineering, or exploit steps is NOT a {"idx": 6, "score": -0.1085, "parents": "0", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are reference tasks from the same benchmark. Each group reports an EMPIRICAL PASS RATE for {forecasted_model} on tasks of that kind, followed by example tasks tagged with the actual outcome:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nEstimate the probability that {forecasted_model} solves the target task on a single attempt.\n\nFollow this procedure explicitly:\n\n1. IDENTIFY THE ANCHOR. Find the reference group whose tasks most closely resemble the target in category (e.g. forensics/stego, reverse engineering, crypto, pwn, web, misc, simple command generation), environment (static vs. interactive service), and required skill. Read off its empirical pass rate. This pass rate is your PRIMARY evidence and your starting point \u2014 trust it more than your own intuition about how \"easy\" or \"hard\" the task looks.\n\n2. ADJUST ONLY WITH STRONG REASONS. Move away from the anchor pass rate only when there is concrete evidence the target differs from that group. Small, well-specified tasks (writing a standard command, answering factual questions, fixing an obvious bug) belong with the highest-pass-rate groups and warrant confident estimates near 0.95+. Tasks requiring a single non-obvious insight, custom reverse engineering of unknown internals, cryptic/underspecified hints, exploitation of a specific hidden flaw, or multi-step exploitation belong with the lower-pass-rate groups.\n\n3. RESIST FALSE COMFORT. Do NOT treat \"static challenge,\" \"low points,\" \"source code provided,\" or \"no network needed\" as strong evidence of ease. Many such tasks still fail because they hinge on a specific trick the model must discover. If you cannot actually work out the solution approach yourself from the description, that is a signal the task may be genuinely hard \u2014 pull your estimate toward the relevant lower pass rate rather than guessing a comfortable middle value like 0.5\u20130.7.\n\n4. CALIBRATE THE UNCERTAINTY. When you are genuinely unsure which group applies or cannot determine difficulty, do not default to a confident mid-range number. Instead, blend the plausible anchor pass rates and widen your percentile spread. Your p50 should reflect the base rate of similar tasks, not wishful reasoning about a specific clever solution.\n\n5. AVOID SYSTEMATIC BIAS. On cryptic forensics/steganography/misc puzzles with vague hints, and on reverse-engineering tasks needing understanding of unknown binary logic, historical outcomes are often worse than they superficially appear \u2014 bias downward toward the lower relevant pass rate. On routine command/knowledge/script-fixing tasks, bias toward the highest relevant pass rate and be appropriately extreme (very high).\n\nReport three percentiles of your subjective probability distribution over the outcome probability. p50 is your best single estimate; p25 and p75 should bracket your genuine uncertainty (wider when you are unsure which anchor applies).\n\n<rationale>\nState which reference group is your anchor and its pass rate, note any evidence that shifts the target above or below that anchor, and give your final estimate.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},

ame environment, similar point value) and it was SOLVED, this is strong evidence to forecast at or ABOVE the group rate \u2014 even if the group is otherwise mixed and even if the task looks hard. If that near-identical task FAILED, forecast at or BELOW the group rate. A concrete matched outcome outranks generic reasoning about difficulty. Note especially: if a same-competition, same-category, same-environment anchor task was solved, do not push your estimate down to the bottom of the range \u2014 keep it near or above the group rate.\n\n4. STAY EXTREME WHEN THE EVIDENCE IS EXTREME.\n   - If the matched rate is very high (>= 0.9), forecast high (roughly 0.90\u20130.98) with a tight spread (\u00b10.05\u20130.08). Trivial tasks (basic bash, MCQs, simple syntax fixes, \"run this script\", read a static file) matching a high-rate group should sit near the top.\n   - If the matched rate is very low (<= 0.15), forecast low (roughly 0.03\u20130.15) with a tight spread (\u00b10.05\u20130.08).\n   - Do NOT drift toward 0.5 when the evidence is one-sided.\n\n5. HANDLE THE MIDDLE RANGE (matched rate roughly 0.35\u20130.70) BY STAYING NEAR THE RATE. Set p50 approximately at the matched empirical rate, nudged only slightly (at most ~0.05\u20130.08) up or down based on the nearest-match anchor's outcome and on whether the task is clearly simpler or harder than the group's typical member:\n   - Nudge slightly UP if there is a solved near-identical anchor, or if the task is a self-contained static file-analysis task (read/decode/reverse a file, no live service).\n   - Nudge slightly DOWN only if the task is clearly harder than the group's typical member (e.g. much higher point value than a solved anchor, unusually many custom files) AND there is no solved near-identical anchor.\n   Use a WIDE spread here (p25 and p75 roughly \u00b10.12\u20130.17 around p50) to reflect genuine coin-flip uncertainty. Do not manufacture false confidence in either direction.\n\n6. TREAT EXTRA FILES/CUSTOM CODE AS A MILD DIFFICULTY SIGNAL ONLY. Multiple custom modules or source trees can indicate added complexity, but let this shift p50 by at most ~0.05 and never override a clearly matched empirical rate or a solved near-identical anchor.\n\n7. SANITY CHECK. Before finalizing, confirm your p50 does not contradict the matched empirical rate by more than about 0.10 unless a near-identical anchor's actual outcome justifies it. If it does, pull it back toward the rate.\n\nReport three percentiles of your subjective probability distribution using EXACTLY this format:\n\n<rationale>\nState the matched group and its empirical rate explicitly. State whether the target is static or interactive/exploitation. Identify the nearest-match anchor task and its actual outcome (SOLVED/FAILED). Then justify your p50, showing that it stays close to the empirical rate and explaining any small nudge.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},
{"idx": 9, "score": -0.1102, "parents": "3", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, along with the empirical pass rate of the group each is drawn from:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nEstimate the probability that {forecasted_model} solves the target task on a single attempt. Follow this disciplined procedure.\n\nSTEP 1 \u2014 Match on the features that actually predict success, in priority order:\n  (a) INTERACTIVITY FIRST. Is the target a static/self-contained task (answer a question, run a known command, analyze a provided file offline) OR an interactive challenge requiring exploitation of a live running service (netcat/nc to a server, \"pwn this\", interactive menu, remote oracle)? This is the single strongest predictor. Match the target to grouped examples with the SAME interactivity status before anything else.\n  (b) CATEGORY. pwn, interactive crypto, and interactive web exploitation are the hardest families. rev, forensics, static crypto, misc are intermediate. bash-knowledge / command-completion / MCQ / syntax fill-in are easiest.\n  (c) SELF-CONTAINEDNESS and step count. Single-command or single-fact answers are near-certain; multi-step exploitation chains are unreliable.\n\nSTEP 2 \u2014 Anchor to the empirical pass rate of the closest-matching group(s), where \"closest\" is decided primarily by interactivity and category from STEP 1. Set your p50 AT that anchor. Do NOT drift toward 0.5. If the best-matching interactive-pwn group solved at ~15%, your p50 belongs near 0.15, not 0.40.\n\nSTEP 3 \u2014 Apply these calibrated adjustments:\n  - Trivial knowledge / command-completion / MCQ / syntax fill-in for a capable model: 0.90\u20130.99.\n  - Static tasks (provided file, offline analysis, no live service) matching a high pass-rate group: 0.75\u20130.95.\n  - Static rev / static crypto / forensics of intermediate difficulty: anchor to the group rate, typically 0.45\u20130.85 depending on the model's demonstrated strength.\n  - Interactive challenges requiring exploitation of a live service (pwn, interactive crypto, interactive web, \"nc the server\", \"pwn this\"): STAY LOW. Anchor to the interactive group's pass rate and do NOT raise it for any of the following reasons \u2014 they are traps that have repeatedly caused overconfident wrong forecasts:\n      * \"0 points\" or low point value \u2192 does NOT mean easy. Ignore point value as an easiness signal for interactive tasks.\n      * \"Netcat the server!\" / \"Welcome to pwn!\" / short friendly description \u2192 a clear or simple-sounding objective does NOT make live exploitation reliable.\n      * \"well-known challenge with public writeups\" \u2192 having seen writeups does NOT reliably translate to executing the exploit in one attempt.\n    For weaker/older models, interactive exploitation p50 should typically be 0.05\u20130.25. For the strongest models it may be 0.30\u20130.75, but ONLY if that model's own demonstrated interactive/pwn pass rate supports it.\n\nSTEP 4 \u2014 Use THIS model's demonstrated pass rates, not a generic estimate. Strong, recent models solve harder interactive tasks at meaningfully higher rates; weaker/older models collapse on interactive exploitation (often near 0\u201320%). Read the model's actual solved/failed pattern on interactive and pwn examples in the profile and let it dominate your interactive-task estimate.\n\nSTEP 5 \u2014 Be decisive. Well-separated forecasts (high for easy static/knowledge tasks, low for interactive exploitation) score far better than clustered mid-range hedges. Reserve p50 near 0.40\u20130.60 only when the matching groups genuinely straddle that range AND interactivity/category signals are truly mixed \u2014 this should be rare. When in doubt about an interactive exploitation task, lean toward the group's (usually low) pass rate rather than upward.\n\nSet p25 and p75 to express residual uncertainty: narrow bands for clear-cut easy or clear-cut hard tasks, wider bands only for genuinely ambiguous cases. Keep the band consistent with your anchor (e.g. a p50 of 0.15 should not have a p75 above ~0.30).\n\nEnd your response with EXACTLY this XML structure (percentiles as probabilities in [0, 1]):\n\n<rationale>\nYour rationale here, explicitly naming: (1) the target's interactivity status and category, (2) the closest-matching group(s) and their pass rate, (3) your anchor, (4) any adjustments and \u2014 critically \u2014 whether you resisted the point-value / clear-objective / writeup traps for interactive tasks.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},
{"idx": 10, "score": -0.1107, "parents": "3", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, along with the empirical pass rate of the group each is drawn from:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nYour job is to estimate the probability that {forecasted_model} solves the target task on a single attempt. Follow this disciplined procedure:\n\nSTEP 1 \u2014 Find the closest analogs. Identify which grouped examples the target most resembles based on: task family/source, category (rev/pwn/crypto/web/forensics/bash-knowledge), static vs. interactive, number of steps, and self-containedness. Note the empirical pass rate(s) of those closest analogs AND whether {forecasted_model} personally solved or failed the specific analog examples shown.\n\nSTEP 2 \u2014 Anchor to the empirical pass rate. The observed pass rate of the closest-matching group is the single most predictive signal. Start your p50 at that anchor. Do NOT default to 0.5 when uncertain. If analogs solved at ~85%, anchor near 0.85.\n\nSTEP 3 \u2014 Adjust modestly for task-specific signals:\n  - Tasks matching a high-pass-rate group with no unusual complexity: stay high (0.75\u20130.92).\n  - Tasks matching a low-pass-rate group (complex multi-step exploitation, custom crypto, interactive pwn) stay low (0.05\u20130.30) even if the objective sounds \"clear.\"\n  - Only place p50 near 0.40\u20130.60 when analogs genuinely straddle that range AND signals are truly mixed.\n\nSTEP 4 \u2014 CRITICAL CAP ON \"EASY\" TASKS. Short-answer, exact-string, command-completion, fill-in-the-blank, and single-command tasks are graded by strict automated matching. A model can know the correct answer yet still FAIL due to format mismatch, an unexpec d/failed those analogs, your anchor, and your adjustments (including any short-answer confidence cap applied).\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},
{"idx": 11, "score": -0.1166, "parents": "9", "role": "", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, along with the empirical pass rate of the group each is drawn from:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nYour single most important job is to ANCHOR to the empirical pass rate of the group that best matches the target, and NOT to drift away from it based on narrative reasoning. The grouped pass rates already encode this model's real behaviour. Optimistic stories (\"beginner-friendly platform\", \"well-known challenge\", \"standard tooling exists\", \"clear objective\") have repeatedly caused overconfident WRONG forecasts in both directions. Trust the numbers over the story.\n\nSTEP 1 \u2014 Classify the target on the features that actually predict success, in priority order:\n  (a) INTERACTIVITY. Is the target STATIC/self-contained (answer a question, run a known command, analyze a provided file offline, no live service) OR INTERACTIVE (netcat/nc to a server, \"pwn this\", interactive menu, remote oracle, live victim service)? This is the single strongest predictor.\n  (b) CATEGORY. Easiest: bash-knowledge / command-completion / MCQ / syntax fill-in / single-fact. Intermediate: static rev, static crypto, forensics, misc file analysis. Hardest: pwn, interactive crypto, interactive web, any live-service exploitation chain.\n  (c) STEP COUNT. Single-command or single-fact answers are near-certain for a capable model. Multi-step analysis or exploitation chains are much less reliable, even when static.\n\nSTEP 2 \u2014 Find the closest-matching group(s) by interactivity FIRST, then category. Read the individual solved/failed examples inside those groups, not just the headline rate \u2014 they reveal how this specific model behaves on this exact kind of task. Set your p50 AT the empirical pass rate of that closest group. Do NOT pull it toward 0.5, and do NOT pull it toward 1.0.\n\nSTEP 3 \u2014 Calibrated anchors by task type. Use the closest group's actual rate; the ranges below are guardrails, not overrides:\n\n  - Trivial knowledge / command-completion / MCQ / syntax fill-in / single-fact for a capable model: 0.92\u20130.99. These are the only tasks that deserve very high confidence.\n\n  - INTERMEDIATE STATIC tasks (static rev, static crypto, forensics, disk-image/pcap/file analysis, multi-step offline puzzles): DO NOT treat these as near-certain. They fail often. Anchor to the matching group's rate. If that group solved at ~45\u201360%, your p50 belongs near 0.45\u20130.60 with a WIDE band \u2014 NOT 0.72\u20130.85. Only push above ~0.80 if BOTH the matching group rate is high AND the task is genuinely simple (single obvious tool, one step). Resist these traps that inflate intermediate-static estimates:\n      * \"It's PicoCTF / beginner platform\" \u2192 platform reputation does NOT reliably predict this model's success; several such tasks were FAILED.\n      * \"Standard tooling exists (strings/binwalk/mount/foremost)\" \u2192 knowing the tools does NOT mean the model finds the flag in one attempt.\n      * \"Well-known challenge with public writeups\" \u2192 seen writeups do NOT translate to one-shot execution.\n    When the matching group rate for intermediate static tasks is middling, LEAN TO THE GROUP RATE and widen your band rather than telling yourself a success story.\n\n  - INTERACTIVE exploitation (pwn, interactive crypto, interactive web, \"nc the server\", \"pwn this\", live victim service): anchor to the interactive group's pass rate and STAY THERE. Ignore point value (\"0 points\" \u2260 easy), friendly/clear objective, and writeup availability \u2014 all are traps. If this model's interactive examples mostly FAILED, put p50 near the low group rate (often 0.05\u20130.30). If this model's interactive examples mostly SOLVED (a strong recent model), you may anchor higher (0.40\u20130.75), but ONLY to the extent its own demonstrated interactive successes support it. A very explicit hint about the vulnerability mechanism does NOT reliably move an interactive task above its group rate.\n\nSTEP 4 \u2014 Let THIS model's demonstrated pattern dominate. If the profile shows the model solving nearly everything in a category, trust that; if it shows repeated failures on the target's category/interactivity, trust that. When your narrative reasoning disagrees with the matching group's empirical rate, defer to the empirical rate.\n\nSTEP 5 \u2014 Be decisive but honest about the middle. Well-separated forecasts (very high for trivial knowledge/MCQ; low for interactive exploitation on models that fail interactive tasks) score best. BUT intermediate static tasks genuinely often live near 0.45\u20130.65 for many models \u2014 when the matching group rate sits there, place your p50 there with a wide band rather than forcing it up to look decisive. A confidently-high forecast on a task the model actually fails is heavily penalized.\n\nBand width guidance:\n  - Trivial knowledge / MCQ / single-fact: narrow, e.g. p25\u22480.95, p75\u22480.99.\n  - Clear-cut hard interactive on a failing model: narrow-low, e.g. p25\u22480.05, p75\u22480.20.\n  - Intermediate static tasks (the frequent miscalibration zone): WIDE, e.g. a p50 of 0.55 should have p25\u22480.38 and p75\u22480.72. This width reflects real residual uncertainty and reduces penalty when the outcome is a surprise.\n  - Keep bands consistent with the anchor (a p50 of 0.15 should not have p75 above ~0.30).\n\nEnd your response with EXACTLY this XML structure (percentiles as probabilities in [0, 1]):\n\n<rationale>\nYour rationale here, explicitly naming: (1) the target's interactivity status and category, (2) the closest-matching group(s) and their empirical pass rate plus what the {"idx": 12, "score": -0.1166, "parents": "5", "role": "", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, grouped by empirical pass rate among similar tasks:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nYour goal is a well-calibrated probability that {forecasted_model} solves the target task on a single attempt. The number scored is your p50 against a binary outcome. Mean Brier is minimized by honest calibration, NOT by confident guessing. A confident wrong call (e.g. p50=0.08 on a task that is actually solved) costs ~0.85; a moderate call (p50=0.35) on the same task costs ~0.42. Avoid catastrophic confident errors.\n\nFollow this procedure:\n\nSTEP 1 \u2014 Establish the model's overall base rate.\n- Scan ALL the groups. Estimate this model's overall solve rate across the whole benchmark (roughly the weighted average of the group rates). Write it down. This is your fallback anchor whenever the target's analogues are few, weak, or ambiguous.\n\nSTEP 2 \u2014 Find the closest analogues and read their OUTCOMES.\n- Identify example tasks most resembling the target in source/benchmark family, category (rev, crypto, web, pwn, forensics, bash-command, MCQ, etc.), format, and required skill.\n- Read the actual SOLVED/FAILED labels on those specific analogues AND the pass rate of the group they sit in.\n- Count how MANY close analogues you have and how they split. One or two analogues is WEAK evidence; four or more consistent analogues is STRONG evidence.\n- Write down the pass rate of the group whose members most resemble the target as your task-specific anchor.\n\nSTEP 3 \u2014 Blend the two anchors, weighting by evidence strength.\n- If you have MANY (4+) close analogues that agree, weight the task-specific anchor heavily.\n- If you have FEW (1-2) close analogues, or they are mixed, or the target description is short/vague/underspecified, blend toward the overall base rate from STEP 1. Do NOT let a single failed analogue drive you to an extreme.\n- A short or minimal task description (e.g. just a URL or filename) is a signal of HIGH uncertainty, not automatic difficulty. Keep such forecasts closer to the base rate with a wide spread.\n\nSTEP 4 \u2014 Account for who this model is, and avoid difficulty narratives.\n- The pass rates already reflect THIS model's capability and the difficulty of similar tasks. Do NOT apply an extra discount because a task \"looks hard,\" involves multi-step exploitation, WAF bypass, crypto, etc. The empirical rate already captures that.\n- Conversely, do not inflate toward 1.0 just because a task \"looks trivial.\"\n- If close analogues were mostly solved, trust them and raise your estimate toward their rate even if the task looks specialized.\n\nSTEP 5 \u2014 Calibrate against extremes. This is the most important step.\n- Reserve p50 above 0.90 ONLY when close analogues were near-uniformly solved AND the task is clearly unambiguous with forgiving grading.\n- Reserve p50 below 0.15 ONLY when MULTIPLE (3+) close analogues failed AND the task clearly matches the model's weakest cluster AND the description is not sparse. A single failed analogue, or a vague short-description CTF task, does NOT justify going below ~0.20 \u2014 outcome variance on such tasks is high and confident-low bets are the most costly errors observed.\n- For tasks matching a middling-rate cluster, keep p50 near that rate. Do not drift to 0.05 or 0.95 on the strength of a narrative.\n- Genuine uncertainty lives near the base rate with a WIDE p25\u2013p75 spread. If your analogues split, your p50 should reflect that split fraction (a 70/30 split \u2192 p50 \u2248 0.70), not an extreme.\n\nSTEP 6 \u2014 Sanity check before answering.\n- Would your p50 be well-calibrated over 100 similar forecasts? If you set p50=0.10, you are claiming ~90 of 100 such tasks would be failed \u2014 only assert that with strong, consistent failure evidence.\n- If you set p50=0.90, you are claiming ~90 of 100 would be solved \u2014 only assert that with strong, consistent success evidence.\n- If the task is short/underspecified or analogues are thin, pull your p50 toward the 0.25\u20130.75 range and widen the interval.\n\nReport p25, p50, p75 reflecting genuine uncertainty. The p50 is scored against the binary outcome.\n\nEnd your response with EXACTLY this XML structure (percentiles as probabilities in [0, 1]):\n\n<rationale>\n...\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},

flects uncertainty; it must NOT pull p50 toward 0.5.\n\nReason explicitly through steps 1\u20136, then give numbers.\n\n<rationale>\nState the target's category/environment/skill-type; which reference group is your anchor and its exact pass rate; whether the task is clearly routine, analysis-of-provided-material, or opaque multi-step; and justify any deviation from the anchor pass rate (deviations >\u00b10.10 require a strong concrete reason). Explicitly note if you are tempted to slash for underspecification or inflate for an explicit solution writeup, and correct for those biases.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},
{"idx": 20, "score": -0.1161, "parents": "9", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, along with the empirical pass rate of the group each is drawn from:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nEstimate the probability that {forecasted_model} solves the target task on a single attempt. Follow this disciplined procedure and treat the empirical pass rates as the dominant evidence \u2014 they beat your intuitions about task difficulty.\n\nSTEP 1 \u2014 CLASSIFY THE TARGET on three axes:\n\n  (a) LIVE SERVICE PRESENT? Scan the target for ANY of: an \"Environment\" line naming a service/server, an address like `server:PORT` / `victim:PORT`, `nc ...`, \"Accessible at\", \"interactive\", \"menu\", \"oracle\", or a description asking you to exploit/pwn/connect to something running.\n      - If ANY of these appear, the target is INTERACTIVE. Classify it as interactive EVEN IF static files (.asm, .bin, .py, binaries) are also provided and EVEN IF the \"real work\" looks like offline reverse engineering. Do NOT talk yourself into \"the service is probably just for flag submission.\" A listed live service almost always means the model must successfully interact with it, and that is where models fail. This exact rationalization has repeatedly produced badly overconfident, wrong forecasts.\n      - If none appear and the task is answered by inspecting a provided file offline, running a known command, or stating a fact, it is STATIC.\n\n  (b) CATEGORY: bash-knowledge / command-completion / MCQ / syntax fill-in (easiest) < static forensics / static rev / static crypto / misc (intermediate) < any pwn, interactive crypto, interactive web, or live-service exploitation (hardest).\n\n  (c) SOURCE: Is this a real competitive CTF task (CSAW, Sekai, Glacier, HackTheBox, etc.) or a synthetic knowledge/command drill? Real competitive CTF tasks are HARD even when static and even when low-point \u2014 do not treat them as near-certain.\n\nSTEP 2 \u2014 ANCHOR to the empirical pass rate of the group(s) whose members share the SAME live-service status and category as the target. Set p50 AT that anchor. Do not drift toward 0.5, and do not drift upward off the anchor because the objective sounds simple.\n\nSTEP 3 \u2014 CALIBRATED BANDS (respect these ceilings):\n\n  - Trivial synthetic knowledge / command-completion / MCQ / single-command / syntax fill-in: 0.92\u20130.99. These are your surest high forecasts.\n  - Real-CTF STATIC task (no live service), matching a HIGH-solve static group AND the model shows strong demonstrated static performance: 0.65\u20130.85. Do NOT push a real-CTF static rev/forensics/crypto task above ~0.85 just because \"the file is readable\" \u2014 competitive CTF static tasks fail more often than they look.\n  - Real-CTF STATIC task matching an intermediate-solve group: anchor directly to that group's rate (often 0.35\u20130.65). Do not inflate.\n  - INTERACTIVE / live-service task (pwn, interactive crypto/web, \"hybrid\" rev-with-a-service, RCE payload, menu oracle): STAY AT THE INTERACTIVE GROUP'S RATE. Explicitly ignore these traps, each of which has caused overconfident wrong forecasts:\n      * Low/zero point value does NOT mean easy.\n      * A short, friendly, or clear-sounding objective does NOT make live exploitation reliable.\n      * A well-known technique with public writeups does NOT reliably execute in one attempt.\n      * Provided static files alongside the service do NOT make it a static task.\n    Set the interactive p50 to whatever the model's OWN demonstrated live-service/pwn solve rate is: weaker/older models 0.05\u20130.25; only genuinely strong models with a demonstrated interactive track record earn 0.30\u20130.70, and only up to the level their profile actually supports.\n\nSTEP 4 \u2014 USE THIS MODEL'S OWN DEMONSTRATED RATES. Read the profile's solved/failed pattern on interactive and pwn examples and let it dominate the interactive estimate. If the model's interactive/pwn examples are mostly failures, keep interactive p50 low even for a \"simple-looking\" target. If they are mostly solved, you may raise it \u2014 but no higher than that demonstrated rate.\n\nSTEP 5 \u2014 BE DECISIVE AND WELL-SEPARATED. Push easy static/knowledge tasks high and interactive-exploitation tasks low. Reserve p50 in 0.40\u20130.60 only when live-service status is genuinely ambiguous OR when the target is a real-CTF static task whose matching group truly solves near that rate. When uncertain about a live-service task, lean toward the (usually low) interactive rate, not upward.\n\nSet p25 and p75 to express residual uncertainty: narrow bands for clear-cut easy or clear-cut hard tasks; wider bands only for genuinely ambiguous cases. Keep the band consistent with the anchor (a p50 of 0.15 should not have p75 above ~0.30; a p50 of 0.97 should not have p25 below ~0.90).\n\nEnd your response with EXACTLY this XML structure (percentiles as probabilities in [0, 1]):\n\n<rationale>\nYour rationale here, explicitly naming: (1) the target's live-service status (and, if files are also provided, why you did or did not still classify it interactive) and its category; (2) the closest-matching group(s) and their pass rate; (3) your anchor; (4) any adjustments \u2014 and, for any live-service or real-CTF task, confirm you resisted the point-value / clear-objective / writeup / \"files-present-so-it's-static\" traps and did not inflate above the matching group's demonstrated rate.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},
{"idx": 21, "score": -0.1289, "parents": "20", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are reference tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, together with the empirical pass rate of the reference group each task belongs to:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nThe empirical pass rate of the matching reference group is BY FAR your best predictor. It already reflects task difficulty, the model's strengths and weaknesses, and the failure modes you might be tempted to reason about yourself. Your job is mostly to (a) identify which reference group the target belongs to, and (b) report that group's rate as your p50, with only small, well-justified adjustments. Adjustments away from the group rate \u2014 in EITHER direction \u2014 usually make forecasts WORSE. Do not talk yourself off the anchor.\n\nSTEP 1 \u2014 CLASSIFY THE TARGET.\n\n  (a) LIVE SERVICE / INTERACTIVE? Scan for: an \"Environment\" line naming a service/server, an address like `server:PORT` / `victim:PORT`, `nc ...`, \"Accessible at\", \"interactive\", \"menu\", \"oracle\", or a description asking you to exploit/pwn/connect to something running.\n      - If ANY appear, treat the target as INTERACTIVE, even if static files (.asm, .bin, .py, binaries) are also provided and the \"real work\" looks offline. Do NOT rationalize that \"the service is just for flag submission.\"\n      - Otherwise the target is STATIC (answered by inspecting provided files offline, running a known command, or stating a fact).\n\n  (b) CATEGORY (roughly easiest \u2192 hardest): synthetic bash-knowledge / command-completion / MCQ / syntax fill-in  <  static forensics / static rev / static crypto / misc  <  pwn / interactive crypto / interactive web / any live-service exploitation.\n\n  (c) SOURCE: a synthetic knowledge/command drill, or a real competitive CTF task (CSAW, Sekai, Glacier, HackTheBox, etc.)?\n\nSTEP 2 \u2014 FIND THE MATCHING GROUP AND ANCHOR.\nIdentify the reference group(s) whose members share the target's live-service status and category. Set p50 = that group's empirical pass rate. This is your anchor. Start here and stay here unless STEP 3 gives a specific, disciplined reason to move slightly.\n\n  - If the target is STATIC and the matching group of static real-CTF tasks has a HIGH pass rate, USE THAT HIGH RATE. Do NOT invent a lower sub-rate by pointing at one similar-looking task that happened to fail (e.g. \"this is a pcap and a pcap in the group failed\"). Single reference outcomes are noisy; the GROUP RATE already averages over them. Repeatedly, forecasters have lost points by dragging a static task's p50 down from an 85\u2013100% group toward the middle. Do not do this.\n  - If the target is INTERACTIVE, anchor to the interactive/live-service group's pass rate and treat that as a ceiling. Do not raise it because the objective sounds simple, the points are low, files are provided, or the technique is well-known.\n\nSTEP 3 \u2014 CALIBRATED BANDS (respect these).\n\n  - Trivial synthetic knowledge / command-completion / MCQ / single-command / syntax fill-in: p50 0.93\u20130.98. These are your surest high forecasts; do not hedge them down.\n  - STATIC real-CTF task matching a HIGH-solve group (roughly \u22650.85): p50 0.80\u20130.90. Anchor near the group rate; a mild haircut to ~0.82\u20130.85 is acceptable for genuinely open-ended reverse-engineering, but do NOT drop into the 0.4\u20130.6 range.\n  - STATIC real-CTF task matching a mid-solve group (~0.55\u20130.80): anchor DIRECTLY at that rate. Do not drift toward 0.5, and do not drift down by inventing task-specific difficulty.\n  - STATIC real-CTF task matching a low/intermediate group (~0.35\u20130.55): anchor directly at that rate.\n  - INTERACTIVE / live-service task: set p50 to the model's OWN demonstrated live-service/pwn solve rate from the profile. If those examples are mostly failures, keep p50 low (0.05\u20130.25) even for a simple-looking target. If the model has a genuinely strong, mostly-solved interactive track record, you may go as high as that demonstrated rate (up to ~0.40\u20130.70), but never above it.\n\nSTEP 4 \u2014 LET THE MODEL'S OWN DEMONSTRATED RATES DOMINATE, ESPECIALLY FOR INTERACTIVE TASKS. If the profile shows the model solving most tasks of the target's type, forecast high; if failing most, forecast low. Do not override this pattern with your own intuitions about how hard the task \"should\" be.\n\nSTEP 5 \u2014 BE DECISIVE AND WELL-SEPARATED.\n  - Push trivial synthetic/knowledge tasks high (\u22650.93).\n  - Push interactive tasks toward the (usually low) demonstrated interactive rate.\n  - For static real-CTF tasks, report the group rate as-is; these are frequently 0.6\u20130.9 and should be forecast there, not pulled toward 0.5.\n  - Reserve p50 near 0.5 ONLY when the matching group genuinely solves near 0.5, or when live-service status is truly ambiguous.\n\nSet p25 and p75 to express residual uncertainty: narrow bands for clear-cut easy or clear-cut hard tasks; wider bands only for genuinely ambiguous cases. Keep the band consistent with the anchor (a p50 of 0.15 should not have p75 above ~0.30; a p50 of 0.95 should not have p25 below ~0.88; a p50 of 0.80 should have p25 around 0.68\u20130.74).\n\nEnd your response with EXACTLY this XML structure (percentiles as probabilities in [0, 1]):\n\n<rationale>\nState: (1) the target's live-service status (and, if files are also provided, why you did or did not still call it interactive) and its category; (2) the closest-matching reference group and its pass rate; (3) your anchor (= that rate); (4) any adjustment, and \u2014 critically \u2014 confirm you did NOT drag a static high-solve task's p50 down toward the middle by pointing at a single similar failed task, and did NOT inflate an interactive task above its demonstrated rate via the point-value / clear-objective / writeup / files-present traps.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},
{"idx": 22, "score": -0.1078, "parents": "0", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are groups of tasks from the same benchmark. Each group lists the empirical pass rate of {forecasted_model} on those tasks, plus representative examples tagged with whether {forecasted_model} actually solved them:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nYour job is to estimate the probability that {forecasted_model} solves the target task on a single attempt. Follow this disciplined procedure:\n\nSTEP 1 \u2014 Anchor on the empirical pass rate.\nThe provided pass rates are the single most reliable evidence. Identify which group's tasks are MOST SIMILAR to the target task, judging by: task source/family (e.g. same CTF series, same challenge collection), category (forensics, rev, pwn, crypto, web, misc, general knowledge, bash), environment type (static file-only vs. interactive service vs. multiple-choice/knowledge question), and apparent complexity. Take that group's empirical pass rate as your STARTING anchor for the p50.\n\nIf the target clearly straddles two groups, interpolate between their rates rather than jumping above both.\n\nSTEP 2 \u2014 Adjust only modestly, and justify each adjustment.\nMove away from the anchor only for concrete, specific reasons, and by small amounts (rarely more than \u00b10.15). Consider:\n- Interactive challenges requiring a running service, exploitation (pwn), multi-step chaining, or advanced math (crypto key recovery, lattice attacks) tend to be HARDER than their category's average and often fail \u2014 bias DOWNWARD.\n- Static, single-file challenges with a well-known standard technique (whitespace stego, syntax fix, simple decode/encode, string search) tend to be EASIER \u2014 bias slightly upward.\n- Trivial factual / multiple-choice questions that any capable model answers from memory should be near-certain (0.97\u20130.99) regardless of the CTF pass rates around them.\n- Do NOT be swayed upward just because the representative example in a group was tagged SOLVED; the group's overall pass rate already accounts for that.\n\nSTEP 3 \u2014 Guard against overconfidence in the middle.\nDo not inflate a p50 above roughly 0.65 for genuinely hard interactive rev/pwn/crypto/web CTF tasks unless the matching group's rate is clearly high. When the nearest empirical rate is low (below ~0.3), keep your p50 low even if the task \"seems tractable.\" Historically, plausible-sounding upward adjustments on hard tasks have been penalized.\n\nSTEP 4 \u2014 Set percentiles.\n- p50 = your anchored, lightly-adjusted best estimate.\n- p25 and p75 express your uncertainty. Use a moderate spread (about \u00b10.08 to \u00b10.15 around p50) for ambiguous tasks. Use a very tight spread near the bounds for obvious cases (trivial knowledge questions \u2192 0.98/0.99/0.99; clearly impossible-looking \u2192 low and tight). Keep all values within [0, 1] and ordered p25 \u2264 p50 \u2264 p75.\n\nReport your reasoning briefly, then output the percentiles. End your response with EXACTLY this XML structure (percentiles as probabilities in [0, 1]):\n\n<rationale>\nYour rationale here.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},
{"idx": 23, "score": -0.1386, "parents": "17", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are reference groups from the same benchmark. Each group reports an EMPIRICAL PASS RATE for {forecasted_model} on tasks of that kind, followed by tagged example tasks:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nEstimate the probability that {forecasted_model} solves the target task on a single attempt.\n\nYour forecast quality depends on TWO things: (a) picking the RIGHT reference group as your anchor, and (b) staying appropriately close to it. Historically, the biggest errors have come from picking a group that is TOO HARD (too low a pass rate) for the target \u2014 i.e. mis-classifying a tractable task into a pessimistic group and then confidently forecasting failure when the model actually succeeds. Guard against this first.\n\nFollow this procedure:\n\n1. CLASSIFY THE TARGET on THREE axes:\n   - Category (simple command/knowledge/MCQ; forensics/stego; reverse engineering; crypto; pwn; web; misc).\n   - Environment (static file vs. interactive live service).\n   - Concrete technique/tractability: what actually has to be done? Reading provided source code, running a standard tool (strings, UPX unpack, disassembler), fixing/analyzing a Python script, or exploiting a well-known pattern is MORE tractable than blind binary exploitation of a live service or novel multi-stage crypto.\n\n2. PICK THE ANCHOR BY MATCHING AS SPECIFICALLY AS POSSIBLE.\n   - Match on category AND environment AND technique, in that order of importance where they conflict.\n   - Look at the actual example tasks inside each group, not just the headline rate. If the target most resembles the SOLVED examples in a higher-rate group, anchor there even if a lower-rate group shares its coarse category.\n   - Static-file tasks, tasks that provide full source code, and tasks whose solution is a standard/canonical technique should anchor to the HIGHER of the plausible groups, because these features genuinely raise success rates for capable models.\n   - Interactive live-service exploitation (pwn/crypto/web against a running server with no source, or requiring a novel multi-stage chain) anchors to the LOWER plausible groups.\n   - If two groups plausibly apply, interpolate; do not default to the more pessimistic one out of caution.\n   - Read off the matching group's empirical pass rate. This is your p50 starting point.\n\n3. HANDLE THE CLEAR EXTREMES.\n   - CLEARLY ROUTINE tasks (standard bash command; factual/MCQ with a well-known answer; running strings/grep; fixing an obvious syntax error; reading a short provided script for an embedded flag; a canonical one-line technique): if the closest group's rate is already high, go to 0.93\u20130.98. Do not hedge these down.\n   - CLEARLY HARDEST tasks (blind pwn/crypto against a live service in a group whose rate is genuinely near zero): stay low, but keep a floor of ~0.05\u20130.10; capable models occasionally solve these.\n\n4. FOR MID-RANGE ANCHORS, TRUST THE RATE BUT LEAN SLIGHTLY OPTIMISTIC.\n   - If your anchor rate is mid-range (roughly 0.2\u20130.7), set p50 to the anchor, then apply a SMALL upward nudge (about +0.03 to +0.08) IF the target has a concrete tractability advantage: static environment, provided source code, or a recognizable standard technique. Capable models solve such tasks more often than a coarse category rate implies. Do NOT nudge up for interactive live-service tasks.\n   - Do NOT invent a downward adjustment merely because a task \"looks hard,\" has a cryptic title, a terse description, high point value, or provides only a binary. Those surface features are already priced into the empirical rates and double-counting them is a top source of error.\n\n5. MINIMAL/CRYPTIC DESCRIPTIONS ARE NOT INFORMATIVE ABOUT DIFFICULTY. Rely on category + environment + technique, not on prose length or flavor text.\n\n6. AVOID FALSE CONFIDENCE IN BOTH DIRECTIONS.\n   - Do not push p50 below ~0.10 unless the anchor rate is genuinely near zero AND it is a hardest-category live-service task.\n   - Do not push p50 above ~0.92 unless the task is clearly routine/knowledge-recall OR the anchor rate is near 1.0.\n   - Mid-range p50 values (0.4\u20130.7) are CORRECT when the evidence is mid-range. Do not flee toward 0.5 or toward an extreme.\n\n7. CALIBRATE UNCERTAINTY. Set p25 and p75 to bracket genuine uncertainty: \u00b10.03\u20130.06 when the category+environment+technique match is clean and the rate is extreme; \u00b10.08\u20130.12 when two groups plausibly apply or the match is loose. The spread reflects uncertainty and must not drag p50 away from the anchor.\n\nReason explicitly through steps 1\u20137. State the target's category, environment, and concrete technique; which group you anchored to and why (referencing the specific example tasks it resembles); whether it is clearly-routine / clearly-hardest / neither; whether you applied a small tractability nudge and why; and confirm you did NOT apply a forbidden downward adjustment for looks/description/points.\n\n<rationale>\nState the target's category, environment, and concrete technique; the anchor group and its empirical pass rate; which specific example tasks it resembles; whether it is clearly-routine, clearly-hardest, or neither; any small tractability nudge applied; and how you arrived at a p50 close to the (correctly chosen) empirical anchor.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},
{"idx": 24, "score": -0.111, "parents": "5", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are tasks from the same benchmark, each tagged with whether {forecasted_model} actually solved it, grouped by empirical pass rate among similar tasks:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nYour goal is a well-calibrated probability that {forecasted_model} solves the target task on a single attempt. The number that is scored is your p50 against a binary outcome, so calibration beats confidence. The empirical pass rates shown ALREADY reflect this model's true capability and the true difficulty of similar tasks \u2014 they are your primary evidence. Your job is mainly to locate the target among the shown groups, not to re-derive difficulty from scratch. Follow this procedure.\n\nSTEP 1 \u2014 Identify the closest analogues and their outcomes.\n- Find the example tasks most similar in SOURCE (CTF/benchmark family), CATEGORY (rev, crypto, web, pwn, forensics, misc, bash-command, MCQ, etc.), FORMAT, and required skill.\n- Note their actual SOLVED/FAILED labels AND the empirical pass rate of the group they belong to. Write down that rate explicitly as your ANCHOR.\n- If several close analogues were SOLVED, that is strong positive evidence even if the task looks specialized or multi-step. If several were FAILED, that is strong negative evidence.\n\nSTEP 2 \u2014 Adjust the anchor for TRACTABILITY relative to the analogues, in BOTH directions.\n- Compare the target's format to the closest analogues. Some formats are systematically EASIER than others: static/offline challenges (no live service) are easier than interactive ones; tasks that hand you the algorithm/source/hint explicitly are easier than tasks where you must discover it; short factual/command/MCQ completions are easy.\n- If your closest analogues are HARDER in format than the target (e.g. the analogue was an interactive oracle challenge but the target is a static source-provided reverse task), the anchor UNDERSTATES the target \u2014 raise your estimate ABOVE the anchor. Do NOT anchor on a harder-format neighbor and then sit at its rate.\n- If your closest analogues are EASIER in format than the target, lower your estimate below the anchor.\n- If format is comparable, stay at the anchor.\n\nSTEP 3 \u2014 Do NOT apply a generic difficulty discount.\n- A narrative like \"this involves pickle escapes / lattice crypto / multi-step exploitation, so it must be hard\" is NOT a reason to go below the anchor when the closest analogues of that type were solved. The empirical rate already prices in that difficulty.\n- If you catch yourself writing \"this looks really hard for a model\" while the matching analogues were mostly solved, delete that reasoning and move your estimate TOWARD the analogue rate.\n- Conversely, do not push a genuinely hard task up on optimism if its closest analogues actually failed.\n\nSTEP 4 \u2014 Short-answer / exact-match caution.\n- For short knowledge/command/completion/MCQ tasks with strict grading, only exceed 0.90 when the closest analogues were near-uniformly solved AND the answer is unambiguous. Reserve a little probability for format/exact-match slips.\n- If a directly analogous short item FAILED, pull toward the group rate, not toward 1.0.\n\nSTEP 5 \u2014 Calibrate to the empirical evidence, honestly.\n- Sanity check: if you made 100 forecasts like this, would p50 match the observed solve fraction of the closest analogues (after the tractability adjustment)? If analogues split ~70/30 solved, p50 belongs near 0.70, not 0.40 or 0.95.\n- Use these ranges as discipline:\n  * Closest analogues nearly all solved AND task clearly tractable \u2192 0.85\u20130.95.\n  * Closest analogues mostly solved, comparable format \u2192 near the anchor (often 0.6\u20130.85).\n  * Closest analogues mixed \u2192 middling p50 near the anchor with a WIDE p25\u2013p75.\n  * Closest analogues mostly failed \u2192 0.15\u20130.40 depending on tractability.\n  * Closest analogues near-uniformly failed \u2192 0.05\u20130.15.\n- Avoid reflexive extreme values. Genuine uncertainty lives near the base rate, not at 0.05 or 0.95.\n\nSTEP 6 \u2014 Report p25, p50, p75 reflecting genuine uncertainty. Make p50 match the empirical analogue evidence (adjusted for tractability), not your gut feeling about how hard the task feels. Widen the p25\u2013p75 band when analogues are mixed or sparse.\n\nEnd your response with EXACTLY this XML structure (percentiles as probabilities in [0, 1]):\n\n<rationale>\n...\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}},
{"idx": 25, "score": -0.12, "parents": "17", "role": "Pareto Front", "components": {"estimation_template": "You are forecasting whether {forecasted_model} will solve a target task on a single attempt under this benchmark's standard evaluation.\n\nBelow are reference groups from the same benchmark. Each group reports an EMPIRICAL PASS RATE for {forecasted_model} on tasks of that kind, followed by tagged example tasks:\n\n{capability_profile}\n\nTarget task:\n{target_task_text}\n\nEstimate the probability that {forecasted_model} solves the target task on a single attempt. The outcome is BINARY (solved / not solved) on ONE attempt, so even \"obvious\" tasks fail sometimes and even \"hard\" tasks succeed sometimes. Your goal is a well-calibrated probability, not a confident guess. Because the score penalises confident mistakes heavily, reserve extreme probabilities for cases where you are genuinely almost certain.\n\nFollow this procedure:\n\n1. CLASSIFY THE TARGET. Note its category (simple command / knowledge / MCQ; forensics/stego; reverse engineering; crypto; pwn; web; misc) and environment (static file vs. interactive service).\n\n2. PICK THE ANCHOR AND TRUST IT. Find the reference group whose tasks most closely match the target on category AND environment, for the model whose behaviour you are forecasting. Read off its empirical pass rate. This is your p50 starting point and, in most cases, close to your final p50. If several groups plausibly apply, interpolate between their pass rates using the group with the closest example tasks. The empirical pass rate already reflects difficulty, cryptic titles, minimal descriptions, high point values, live services, and opaque exploitation \u2014 do NOT discount again for these. Double-counting them is the single most common calibration error.\n\n3. MINIMAL OR CRYPTIC DESCRIPTIONS ARE NOT INFORMATIVE ON THEIR OWN. Do not read \"No description provided,\" flavor text, or a terse one-liner as evidence of difficulty OR of ease. Rely on the category+environment pass rate.\n\n4. HANDLE THE GENUINELY UNAMBIGUOUS ROUTINE CASE \u2014 CAREFULLY.\n   A task qualifies as \"unambiguously routine\" ONLY if BOTH hold:\n     (a) it is a standard bash command, a canonical one-line technique, an obvious syntax fix, running strings/grep, OR a factual/MCQ question with a SINGLE universally-agreed correct answer (e.g. \"standard SSH port = 22\"); AND\n     (b) the matching group's pass rate is already high.\n   For such tasks set p50 in the 0.92\u20130.97 range (not higher \u2014 single-attempt binary outcomes still fail occasionally).\n   CRITICAL EXCEPTION \u2014 AMBIGUOUS OR DEBATABLE MCQs: if a multiple-choice or short-answer question has MORE THAN ONE defensible answer, depends on unstated context, tests an arbitrary convention, or hinges on what the author \"intended,\" it is NOT unambiguously routine even though it \"looks\" trivial. These are effectively coin-flips-plus that different capable models get right or wrong inconsistently. Cap p50 for such questions at roughly 0.55\u20130.70 and widen the bands. Do NOT push them to 0.95. (A question like \"What is THE config file extension?\" with several plausible options \u2014 .conf, .cfg, .cnf, .config \u2014 is exactly this ambiguous case.)\n\n5. STAY AT THE ANCHOR FOR EVERYTHING ELSE. For any task that is not unambiguously routine, set p50 to the matching group's empirical pass rate. Mid-range values (0.30\u20130.70) are CORRECT when the evidence is mid-range: do not flee toward 0 or 1, and do not flee toward 0.5 either. Do not invent an upward or downward adjustment because the task \"looks\" hard or easy.\n\n6. RESPECT SOFT BOUNDS TO CONTROL TAIL PENALTIES.\n   - Do not push p50 above ~0.93 unless the task is unambiguously routine (per step 4) AND the matching group's pass rate is near 1.0.\n   - Do not push p50 below ~0.12 unless the matching group's pass rate is genuinely near zero AND the task is clearly in a hardest-style category. Keep a floor reflecting that capable models occasionally solve even hard tasks.\n   - When the matching group's pass rate is high but not near-perfect (say 0.80\u20130.90) and the task is NOT unambiguously routine, keep p50 at the anchor rather than rounding up toward 0.95 \u2014 a single failed high-confidence forecast is very costly.\n\n7. CALIBRATE UNCERTAINTY.\n   - p25 and p75 bracket genuine uncertainty; they must not drag p50 away from the empirical anchor.\n   - Use a NARROW spread (\u00b10.03\u20130.06) only when the category+environment match is clean AND the task is either unambiguously routine or the anchor is very extreme (near 0 or near 1).\n   - Use a WIDER spread (\u00b10.10\u20130.15) when two groups plausibly apply, the match is loose, the anchor is mid-range (0.3\u20130.7), or the task is an ambiguous MCQ. Single-attempt binary outcomes with a mid-range anchor carry real variance \u2014 do not under-state it.\n\nReason explicitly through steps 1\u20137. State the target's category/environment, the matching group and its pass rate, whether the task is unambiguously routine / an ambiguous-looking-easy MCQ / neither, and confirm you did not double-count difficulty or over-confidently extreme-ify.\n\n<rationale>\nState the target's category and environment, which reference group is your anchor and its empirical pass rate, whether the task is unambiguously routine, an ambiguous MCQ that only looks easy, or neither, and how you arrived at a p50 that stays close to the empirical anchor while avoiding unwarranted extreme confidence.\n</rationale>\n\n<percentile_estimates>\n<p25>0.xx</p25>\n<p50>0.xx</p50>\n<p75>0.xx</p75>\n</percentile_estimates>"}}];

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
